name: earshot_server
description: Earshot server. Serves the web app, a JSON API and RSS feeds, and lists Walrus blobs hosts stored with their own wallet after checking them on Sui.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.6
  http: ^1.5.0
  mime: ^2.0.0
  path: ^1.9.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  sqlite3: ^2.9.4
  sui_auth:
    path: ../packages/sui_auth
  walrus_blob_check:
    path: ../packages/walrus_blob_check
  xml: ^6.6.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
